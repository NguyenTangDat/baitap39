<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK8: Chuyển đổi màu Hex sang RGB</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="color"], input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .color-preview {
            width: 100%;
            height: 50px;
            margin-top: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bài tập TK8: Hex sang RGB</h2>
    
    <div class="form-group">
        <label for="hexInput">Chọn hoặc nhập mã Hex (ví dụ: #ff0000):</label>
        <input type="text" id="hexInput" value="#3498db" placeholder="#000000">
    </div>

    <button onclick="convertToRgb()">Chuyển đổi</button>

    <div class="result-box" id="result">rgb(52, 152, 219)</div>
    <div class="color-preview" id="colorPreview" style="background-color: #3498db;"></div>
</div>

<script>
    function convertToRgb() {
        let hex = document.getElementById('hexInput').value.trim();
        
        // Chuẩn hóa mã hex (loại bỏ dấu # nếu có)
        if (hex.startsWith('#')) {
            hex = hex.slice(1);
        }

        // Kiểm tra mã hex hợp lệ (3 hoặc 6 ký tự)
        if (hex.length === 3) {
            hex = hex.split('').map(char => char + char).join('');
        }

        if (hex.length !== 6 || isNaN(Number('0x' + hex))) {
            alert('Mã Hex không hợp lệ! Vui lòng nhập đúng định dạng (ví dụ: #ff0000)');
            return;
        }

        // Chuyển đổi từng cặp 2 ký tự hệ Hex sang thập phân (Decimal)
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);

        const rgbResult = `rgb(${r}, ${g}, ${b})`;

        // Hiển thị kết quả và đổi màu ô preview
        document.getElementById('result').innerText = rgbResult;
        document.getElementById('colorPreview').style.backgroundColor = rgbResult;
    }
</script>

</body>
</html>
