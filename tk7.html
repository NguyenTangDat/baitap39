<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK7: Tạo chuỗi ngẫu nhiên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            word-break: break-all;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bài tập TK7: Tạo chuỗi ngẫu nhiên</h2>
    
    <div class="form-group">
        <label for="length">Nhập độ dài chuỗi:</label>
        <input type="number" id="length" value="10" min="1" max="100">
    </div>

    <button onclick="generateRandomString()">Tạo chuỗi ngẫu nhiên</button>

    <div class="result-box" id="result">Chuỗi sẽ hiển thị ở đây...</div>
</div>

<script>
    function generateRandomString() {
        // Lấy giá trị độ dài người dùng nhập
        const length = document.getElementById('length').value;
        
        // Các ký tự cho phép xuất hiện trong chuỗi ngẫu nhiên
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        
        // Vòng lặp lấy ngẫu nhiên các ký tự
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * characters.length);
            result += characters.charAt(randomIndex);
        }
        
        // Hiển thị kết quả ra màn hình
        document.getElementById('result').innerText = result;
    }
</script>

</body>
</html>
